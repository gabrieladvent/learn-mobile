name: CI

on:
  pull_request:
  push:
    branches: [main, development]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.2
          channel: stable
          cache: true

      - name: Ambil dependency
        run: flutter pub get

      - name: Bangun berkas hasil generate
        run: dart run build_runner build --delete-conflicting-outputs

      - name: Analisis statis
        run: flutter analyze

      - name: Test
        run: flutter test
